'use strict';

  pageTitle: '2.1 Choose a reference',

  body2: 'Start with ten seconds. Name each shot, note its first and last frame, and copy the camera before you copy the colours.',

  blueHi:'#4A80FF', tealHi:'#5AD4F4', mintHi:'#68DFB1', wall2:'#3E5F92', wall4:'#8AAED0', glass:'#D6E8FF',
  glassShadow:'#0C1A38', bar:'#182544', tintS3:'#E6F4FE', tintS4:'#E2F4FE', halo8:'#D6E2F0',

// ───────────────────────────── math ─────────────────────────────

    ring1: mixHex(W, c.teal, .2), ring2: mixHex(W, c.teal, .1), ring3: mixHex(W, c.teal, .03),
    blueHi: mixHex(c.blue, W, .14), tealHi: mixHex(c.teal, W, .18), mintHi: mixHex(c.mint, W, .14),
    wall2: mixHex(c.deep, c.sky, .3), wall4: mixHex(c.sky, W, .18), glass: mixHex(W, c.blue, .17),
    glassShadow: mixHex(c.navy, BK, .55), bar: mixHex(c.navy, BK, .2), tintS3: mixHex(W, c.teal, .12), tintS4: mixHex(W, c.teal, .14),
    halo8: mixHex(W, c.haze, .45), launchTop: mixHex(c.navy, BK, .25), launchBot: mixHex(c.sky, c.deep, .1),
    planetTop: mixHex(c.navy, c.deep, .5), planetBot: mixHex(c.navy, BK, .5), rim: mixHex(W, c.ice, .5),
    soundA: mixHex(c.navy, BK, .15), soundB: mixHex(c.deep, c.teal, .2), barMid: mixHex(c.mint, W, .6),
    miniBar: mixHex(c.navy, BK, .1), refA: mixHex(W, c.ice, .7), refB: c.haze};

const K = BRAND.palette ? Object.assign(deriveTints(C), BRAND.tints) : Object.assign({}, DEF_K, BRAND.tints);

// ───────────────────────────── filters ─────────────────────────────
const FX = {};

  if (sx < 0.04 && sy < 0.04) return '';

    const ns = 'http://www.w3.org/2000/svg', fl = document.createElementNS(ns, 'filter');
    fl.setAttribute('id', id); fl.setAttribute('filterUnits', 'userSpaceOnUse');
    fl.setAttribute('x', '-700'); fl.setAttribute('y', '-700'); fl.setAttribute('width', '2600'); fl.setAttribute('height', '2600');
    fl.setAttribute('color-interpolation-filters', 'sRGB');

    document.querySelector('#fx defs').appendChild(fl); FX[id] = g;

// ───────────────────────────── drawing bits ─────────────────────────────
// The brand mark. Without a logo it is drawn: four corner brackets around the monogram (P.mono).
// With brand.json "logoSvgPath" the logo replaces it everywhere — S1 disc, S2 app icon, S3 menu bar, S7 disc and
// the canvas art (S1 course cover, S5 mini storyboard). logo.tint paints the logo's silhouette in each spot's
// colour (dark on the light discs, white on the navy icon and the menu bar); tint:false keeps its own colours.
const LOGO = BRAND.logo && (BRAND.logo.svg || BRAND.logo.data)
  ? {svg: BRAND.logo.svg, url: BRAND.logo.data, tint: BRAND.logo.tint !== false, scale: BRAND.logo.scale || .8, img: null} : null;

function markSVG(color, size) {
  if (LOGO) {
    const s = (size * LOGO.scale).toFixed(2), u = `url('${LOGO.url}') center/contain no-repeat`;   // single quotes: this lands inside style="…"
    return `<div style="width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center">

  }

  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="display:block;overflow:visible">
  <g fill="none" stroke="${color}" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M11 33V20a9 9 0 0 1 9-9h13"/><path d="M67 11h13a9 9 0 0 1 9 9v13"/>
  <path d="M89 67v13a9 9 0 0 1-9 9H67"/><path d="M33 89H20a9 9 0 0 1-9-9V67"/></g>
  <text x="50.6" y="${+(64.6 - (40 - fs) * .36).toFixed(2)}" text-anchor="middle" font-family="Inter" font-weight="700" font-size="${+fs.toFixed(2)}" letter-spacing="${+(-fs * .04).toFixed(2)}" fill="${color}">${h(P.mono)}</text></svg>`;

// Rasterise the logo once (SVG or bitmap), crop it to its opaque pixels so every logo sits at the same visual

// canvas: the logo fitted (contain) in a square of side box·scale centred on cx,cy
function drawLogo(x, cx, cy, box, color, alpha = 1) {

const CURSOR = `<svg width="32" height="39" viewBox="0 0 32 39" style="display:block;overflow:visible">
  <path d="M3.5 2.5V30.6L9.9 24.6L14.6 35.4L19.6 33.3L14.9 22.7H23.8Z" fill="#050505" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" paint-order="stroke"/></svg>`;
function setCursor(el, fid, x, y, rot, sc, vx, vy, op = 1) {

  el.style.transform = `translate(${(x - 3.5).toFixed(2)}px,${(y - 2.5).toFixed(2)}px) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(4)})`;

  let g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, K.soundA); g.addColorStop(1, K.soundB);
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  glow(x, w * .84, h * .18, h * 1.0, C.teal, .55); glow(x, w * .08, h * .98, h * .85, C.mint, .5);
  const rx = w * .84, ry = h * .18;
  for (let r = 22; r < 720; r += 29) { x.strokeStyle = `rgba(255,255,255,${(.5 * (1 - r / 720)).toFixed(3)})`; x.lineWidth = 1.3; x.beginPath(); x.arc(rx, ry, r, 0, 7); x.stroke(); }
  const n = 36, x0 = 34, x1 = w - 34, cy = h * .4;
  const ph = [R() * 6, R() * 6, R() * 6];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1), bx = lerp(x0, x1, t);
    const env = Math.sin(Math.PI * t) ** .7;
    const a = Math.abs(Math.sin(t * 7.1 + ph[0]) * .55 + Math.sin(t * 17.3 + ph[1]) * .3 + Math.sin(t * 31 + ph[2]) * .15);
    const bh = 10 + 128 * env * a;
    g = x.createLinearGradient(0, cy - bh / 2, 0, cy + bh / 2); g.addColorStop(0, '#FFFFFF'); g.addColorStop(.5, K.barMid); g.addColorStop(1, C.mint);
    x.fillStyle = g; rrect(x, bx - 3.5, cy - bh / 2, 7, bh, 3.5); x.fill();
  }
  sparkle(x, w * .12, h * .16, 10, 'rgba(255,255,255,.85)');
  return c;
}
function miniScene(x, kind, w, h) {
  if (kind === 0) {           // disc + mark on white
    x.fillStyle = C.page; x.fillRect(0, 0, w, h);
    glow(x, w / 2, h * .9, w * .5, K.glowB, .9);
    x.fillStyle = '#F6F6F6'; x.strokeStyle = '#E4E4E6'; x.lineWidth = 1.2; x.beginPath(); x.arc(w / 2, h / 2, h * .27, 0, 7); x.fill(); x.stroke();
    if (LOGO) drawLogo(x, w / 2, h / 2, h * .26 / .78, '#16181D');
    else {
      brackets(x, w / 2, h / 2, h * .26, 3.2, '#16181D');
      x.fillStyle = '#16181D'; x.font = `700 ${h * .11 * monoSize() / 40}px Inter`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(P.mono, w / 2, h / 2 + 1);
    }
  } else if (kind === 1) {    // navy icon + cross
    x.fillStyle = C.page; x.fillRect(0, 0, w, h);
    const s = h * .3, cx = w / 2, cy = h / 2;
    x.fillStyle = '#E9E9E7'; x.beginPath(); x.arc(cx, cy, s * .9, 0, 7); x.fill();
    const g = x.createLinearGradient(0, cy - s / 2, 0, cy + s / 2); g.addColorStop(0, C.deep); g.addColorStop(1, C.navy);
    x.fillStyle = g; rrect(x, cx - s / 2, cy - s / 2, s, s, s * .28); x.fill();
    if (LOGO) drawLogo(x, cx, cy, s * .55 / .78, '#FFFFFF'); else brackets(x, cx, cy, s * .55, 2.4, '#fff');
    const q = s * .48, o = s * 1.18;
    for (const [dx, dy, col] of [[-o, 0, '#FFFFFF'], [0, -o, C.blue], [o, 0, C.teal], [0, o, C.mint]]) {
      x.fillStyle = col; rrect(x, cx + dx - q / 2, cy + dy - q / 2, q, q, q * .28); x.fill();
      if (col === '#FFFFFF') { x.strokeStyle = '#E3E8EF'; x.lineWidth = 1; x.stroke(); }
    }
  } else {                    // glass prompt over sky
    const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, C.deep); g.addColorStop(1, C.sky);
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.fillStyle = K.miniBar; x.fillRect(0, 0, w, h * .14);
    glow(x, w * .9, h * .3, h * .7, C.teal, .45);
    x.fillStyle = 'rgba(255,255,255,.26)'; x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 1.2;
    rrect(x, w * .14, h * .34, w * .72, h * .4, h * .1); x.fill(); x.stroke();
    x.fillStyle = 'rgba(255,255,255,.9)'; rrect(x, w * .2, h * .44, w * .38, h * .05, 3); x.fill();

  }
}
function artRef(w, h) {
  const [c, x] = cv(w, h);
  let g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, K.refA); g.addColorStop(1, K.refB);
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  glow(x, w * .15, h * .1, w * .6, '#FFFFFF', .9); glow(x, w * .95, h * .95, w * .6, C.teal, .28);
  const fw = 316, fh = 200;
  for (const [cx, cy, rot, kind] of [[w * .33, h * .32, -7, 0], [w * .67, h * .44, 5, 1], [w * .45, h * .7, -2, 2]]) {
    x.save(); x.translate(cx, cy); x.rotate(rot * Math.PI / 180);
    x.shadowColor = rgba(C.navy, .28); x.shadowBlur = 30; x.shadowOffsetY = 12;
    x.fillStyle = '#fff'; rrect(x, -fw / 2 - 7, -fh / 2 - 7, fw + 14, fh + 14, 24); x.fill();
    x.shadowColor = 'transparent';
    rrect(x, -fw / 2, -fh / 2, fw, fh, 18); x.clip();
    x.translate(-fw / 2, -fh / 2); miniScene(x, kind, fw, fh);
    x.restore();
  }
  // frosted play button
  const px = w * .5, py = h * .5;
  x.save(); x.shadowColor = rgba(C.navy, .25); x.shadowBlur = 24; x.fillStyle = 'rgba(255,255,255,.78)';
  x.beginPath(); x.arc(px, py, 46, 0, 7); x.fill(); x.restore();
  x.strokeStyle = 'rgba(255,255,255,.95)'; x.lineWidth = 1.5; x.beginPath(); x.arc(px, py, 46, 0, 7); x.stroke();
  x.fillStyle = C.navy; x.beginPath(); x.moveTo(px - 12, py - 18); x.lineTo(px + 20, py); x.lineTo(px - 12, py + 18); x.closePath(); x.fill();
  return c;
}
function frosted(src, w, h, b = 16, lift = .42) {
  const [c, x] = cv(w, h);
  x.filter = `blur(${b}px) saturate(1.25)`; x.drawImage(src, -b * 2, -b * 2, w + b * 4, h + b * 4); x.filter = 'none';

  x.fillStyle = g; x.fillRect(0, 0, w, h);
  return c;
}

  gl.style.transform = `translate(${(gcx - w / 2).toFixed(2)}px,${gtop.toFixed(2)}px)`;
  const gv = Math.abs(vel(g => spring(g - 116, .75, .475), f)) * 676;
  gl.style.filter = filt(blur(Math.min(4, gv * .06)));
  $('s3txt').textContent = P.prompt.slice(0, typedCount(f));
  const inner = E.out2(u01(f, 117.5, 121));
  $('s3txtwrap').style.opacity = inner; $('s3icons').style.opacity = inner;
  const send = $('s3send');
  send.style.opacity = inner;
  send.style.transform = `translate(${(w - 51 - 30).toFixed(2)}px,${(h - 51 - 24).toFixed(2)}px)`;
  // cursor
  const cur = $('s3cur');
  const press = 1 - .15 * Math.sin(Math.PI * u01(f, 113, 117));
  setCursor(cur, 's3curB', tbl(f, C3X), tbl(f, C3Y), 0, 1.22 * press,
    vel(g => tbl(g, C3X), f), vel(g => tbl(g, C3Y), f), E.out2(u01(f, 101.5, 103)));
  $('s3tint').style.opacity = .78 * E.in2(u01(f, 154, 158.6));
}

// ───────────────────────────── S4 + S5 ─────────────────────────────
const SCR = [[159, 420], [160, 315], [161, 210], [162, 170], [163, 140], [164, 116], [165, 96], [166, 81], [167, 67], [168, 55.5], [169, 45.5],
  [170, 37], [171, 30], [172, 24.4], [173, 19.8], [174, 16.6], [175, 14], [176, 10.6], [177, 7.6], [178, 4.9], [179, 2.3], [180, 0], [183, -3], [186, -6]];
const scrollY = f => f <= 186 ? tbl(f, SCR) : -6 - (f - 186);
const SMEAR = [[159, 24], [160, 15], [161, 9], [162, 5.5], [163, 3.4], [164, 2.2], [165, 1.5], [166, .9], [167, .45], [168, .15], [169, 0]];
const COV = [[187, 642], [189, 530], [191, 456], [193, 421], [196, 395], [198, 380.5], [200, 369], [202, 359.5], [205, 348]];
const coverTop = f => f <= 205 ? tbl(f, COV) : 348 - 4 * (f - 205) - (f > 207 ? 1.1 * Math.pow(f - 207, 2) : 0);
const CARDB = [[187, 3.2], [189, 3.8], [191, 3.0], [194, 1.8], [197, .9], [201, 0]];
function r4(f) {
  $('s4bg').style.background = mix(K.tintS4, C.page, E.out2(u01(f, 159, 165)));
  const sy = scrollY(f), vs = vel(scrollY, f);
  const page = $('s4page');
  page.style.transform = `translateY(${sy.toFixed(2)}px)`;
  const sm = tbl(f, SMEAR);
  const pageB = f >= 187 ? 2.5 * E.out2(u01(f, 187, 196)) : 0;
  page.style.filter = filt(dblur('s4pageB', sm * .12, sm), blur(pageB));
  // cursor rides the scroll, stops under the key phrase, then drifts right
  const tx = L.keyX + L.keyW * .28, ty = L.keyBot + 13;
  const drift = f > 180 ? 1.4 * Math.pow(f - 180, 1.35) : 0;
  const cx = tx + drift, cy = ty + sy;
  setCursor($('s4cur'), 's4curB', cx, cy, 17, 1.18, f > 180 ? 1.89 * Math.pow(f - 180, .35) : 0, vs, E.out2(u01(f, 159, 160.5)));
  // S5 card
  const card = $('s5card');
  if (f < 187) { card.style.display = 'none'; $('s4cam').style.filter = 'none'; return; }
  card.style.display = 'block';
  const ct = coverTop(f), vc = vel(coverTop, f);
  const ex = E.in2(u01(f, 207, 214.6));
  card.style.transform = `translateY(${(ct - 24).toFixed(2)}px) scale(${(1 - .05 * ex).toFixed(4)})`;
  card.style.filter = filt(dblur('s5cardB', 0, Math.min(6, Math.abs(vc) * .04)), blur(tbl(f, CARDB)));
  $('s4cam').style.filter = filt(blur(f >= 207 ? lerp(1, 7, E.in2(u01(f, 207, 214))) : 0));
}

// ───────────────────────────── S6 ─────────────────────────────
const S6B = [[215, 12], [217, 7], [219, 3.8], [221, 1.8], [224, 0]];
const s6Off = f => -3 * ramp(f, 226, 232) - .9 * Math.pow(Math.max(0, f - 237), 2.4);
function r6(f) {
  const k = f - 215, off = s6Off(f), voff = vel(s6Off, f);
  const ya = 168 + 96 * Math.pow(.8, k) + off, sa = 1 + .08 * Math.pow(.8, k);
  const yb = 552 + 375 * Math.pow(.76, k) + off;
  const via = vel(g => 168 + 96 * Math.pow(.8, g - 215) + s6Off(g), f), vib = vel(g => 552 + 375 * Math.pow(.76, g - 215) + s6Off(g), f);
  const inB = tbl(f, S6B), outB = 9 * E.in2(u01(f, 238, 244.6));
  const a = $('s6c0'), b = $('s6c1');
  a.style.transform = `translateY(${ya.toFixed(2)}px) scale(${sa.toFixed(4)})`;
  b.style.transform = `translateY(${yb.toFixed(2)}px)`;
  a.style.filter = filt(dblur('s6aB', 0, Math.min(10, Math.abs(via) * .06)), blur(inB + outB));
  b.style.filter = filt(dblur('s6bB', 0, Math.min(10, Math.abs(vib) * .06)), blur(inB * 1.1 + outB));
}

// ───────────────────────────── S7 ─────────────────────────────
const D7 = [[245, 569], [247, 523], [250, 491], [252, 478], [255, 468], [258, 462], [262, 458.6], [266, 456.6], [269, 456]];
const discTop = f => f <= 269 ? tbl(f, D7) : 456;
const discD = f => { if (f <= 287) return 168; const u = (f - 287) / 13; return lerp(168, 123, .1 * u + .9 * u * u * u); };
function r7(f) {
  const d = discD(f), top = discTop(f), cy = top + 84;
  const disc = $('s7disc');
  disc.style.transform = `translate(${540 - 84}px,${(cy - 84).toFixed(2)}px) scale(${(d / 168).toFixed(5)})`;
  const vy = vel(discTop, f), vd = Math.abs(vel(discD, f));
  disc.style.filter = filt(dblur('s7B', 0, Math.min(12, Math.abs(vy) * .42 + (f < 246 ? 3 : 0))), blur(Math.min(2, vd * .07)));
}

// ───────────────────────────── S8 ─────────────────────────────
const WW = [[301, 1650], [302, 1350], [303, 1110], [304, 1049], [306, 925], [309, 734], [311, 678], [315, 612], [320, 563], [326, 540], [334, 525], [342, 516], [350, 492]];
const wordW = f => f <= 350 ? tbl(f, WW) : 492 - 3 * (f - 350) - .116 * Math.pow(f - 350, 3.39);
function r8(f) {
  const w = wordW(f), v = vel(wordW, f), s = w / L.w8;
  const place = (el, sc) => { el.style.transform = `translate(${(540 - L.w8 * sc / 2).toFixed(2)}px,${(540 - L.h8 * sc / 2).toFixed(2)}px) scale(${sc.toFixed(5)})`; };
  const word = $('s8word'), wg = $('s8wordglow');
  place(word, s); place(wg, s);
  const endB = 3.5 * E.in2(u01(f, 350, 359));
  word.style.filter = filt(dblur('s8wB', Math.min(22, Math.abs(v) * .055), 0), blur(endB));
  wg.style.filter = filt(blur(10 + 30 * clamp(Math.abs(v) / 300)));
  const halo = $('s8halo'), hs = w / 560;
  halo.style.transform = `translate(90px,360px) scale(${hs.toFixed(4)},${(.85 + .15 * hs).toFixed(4)})`;
  // zoom streaks: scaled, faded copies while the word is still flying in
  const zs = clamp(Math.abs(v) / w, 0, .7), streakOn = 1 - E.out2(u01(f, 301, 310));
  const copies = document.querySelectorAll('.w8c');
  copies.forEach((el, i) => {
    const t = (i + 1) / copies.length;
    if (streakOn <= 0.002) { el.style.opacity = 0; return; }
    place(el, s * (1 + zs * 1.4 * t));
    el.style.opacity = (.16 * (1 - t) * streakOn).toFixed(4);
    el.style.filter = filt(dblur('s8c' + i, 4 + 10 * t, 0));
  });
}

// ───────────────────────────── shots + seek ─────────────────────────────
const SHOTS = [
  {id: 's1', f0: 0, f1: 71, render: r1}, {id: 's2', f0: 72, f1: 100, render: r2}, {id: 's3', f0: 101, f1: 158, render: r3},
  {id: 's4', f0: 159, f1: 214, render: r4}, {id: 's6', f0: 215, f1: 244, render: r6}, {id: 's7', f0: 245, f1: 300, render: r7},
  {id: 's8', f0: 301, f1: 359, render: r8}];
let current = null;
window.seek = function (f) {
  const s = SHOTS.find(s => f >= s.f0 && f < s.f1 + 1) || SHOTS[SHOTS.length - 1];
  if (current !== s) { if (current) $(current.id).style.display = 'none'; $(s.id).style.display = 'block'; current = s; }
  s.render(f);
  if (window.DEBUG) { const d = $('dbg'); d.style.display = 'block'; d.textContent = `f${f}`; }
  return s.id;
};

window.stageReady = (async () => {
  if (!P.body.some(b => b && typeof b === 'object' && typeof b.k === 'string')) throw new Error('copy.body needs one {"k": "key phrase"} entry');
  if (LOGO) await prepLogo();
  stage.style.background = C.page;
  buildDOM();
  await Promise.all([400, 500, 600, 700].map(w => document.fonts.load(`${w} 40px Inter`)));
  await document.fonts.ready;
  const art = {course: artCourse(440, 228), ref: artRef(627, 536), launch: artLaunch(538, 348), sound: artSound(538, 348)};
  IMG.course = art.course.toDataURL(); IMG.ref = art.ref.toDataURL(); IMG.launch = art.launch.toDataURL(); IMG.sound = art.sound.toDataURL();
  IMG.glass0 = frosted(art.launch, 538, 348).toDataURL(); IMG.glass1 = frosted(art.sound, 538, 348).toDataURL();
  await Promise.all(Object.values(IMG).map(u => { const i = new Image(); i.src = u; return i.decode(); }));
  $('s1cover').style.backgroundImage = `url(${IMG.course})`;
  $('s5cover').style.backgroundImage = `url(${IMG.ref})`;
  $('s6cov0').style.backgroundImage = `url(${IMG.launch})`;
  $('s6cov1').style.backgroundImage = `url(${IMG.sound})`;
  layout();
  TYPE = typingTimes();
  window.TYPING = TYPE.slice();
  window.LAYOUT = {warnings: WARN, lockK: L.lockK, promptLines: L.promptLines, logo: LOGO ? {aspect: +LOGO.aspect.toFixed(3), tint: LOGO.tint} : null};
  const q = new URLSearchParams(location.search);
  window.DEBUG = q.has('debug');
  window.seek(q.has('f') ? parseFloat(q.get('f')) : 0);
  return true;
})();
</script>
