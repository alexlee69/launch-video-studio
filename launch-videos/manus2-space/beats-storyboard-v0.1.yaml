# manus2-space — "The Lull": a Manus 2.0 launch film that recreates higgsfield01 (hf01) frame for frame in motion and
# structure, with our own story (the astronaut), copy, actor, footage and music. STORYBOARD STAGE (DRAFT v0.1,
# 2026-10-23): nothing is generated; every live-action shot shows a labelled PLACEHOLDER PLATE (assets/plates/, drawn by
# tools/make_plates.py) and every screen is a job-local storyboard stand-in block (blocks/: plate, status, editor, endcard).
# Source of truth: hf01-study/storyboard-space/final/shotlist.json (+ SHOTLIST.md, CAST.md, COPY.md, STORY.md).
# Timing: 27 shots on hf01's 26 cut frames (hf01-study/cuts/cuts.json); every shot is sec: <hf01 frames>/30 (4 decimals),
# so shot k starts on hf01 frame n (checked by --grid + tools/grid_check.py, see hf01-study/storyboard-space/grid-check.txt).
# In the stand-in blocks every timing field is an hf01 frame number `n` (n0 = the shot's first frame), so each value can
# be read against SHOTLIST.md; heroAt = the hf01 frame the storyboard still shows.
# Fictional names (clear before release): The Lull, Arden Station (never on screen), Commander Wren Adair (never on screen).
title: Manus 2.0 — The Lull
slug: manus2-space
aspects: [16x9]
thumbnail: S14

brand:
  name: Manus
  logo: assets/manus-mark-dark.svg        # official mark (manus.im); -white for dark grounds; never rotated or used as a character
  # Manus brand look (PITCH §2): off-white ground, ink, ONE sky-blue accent on at most one word per card, #2CB4F3 line icons.
  # Font: Inter (the skill's default face = the Inter-class sans the brand calls for); serif only inside the wordmark file.
  colors: {bg: "#F7F7F7", ink: "#1F1F1F", muted: "#6B6B6B", accent: "#33ABFB", accent2: "#2CB4F3", accent3: "#BAE3FA", dark: "#050908", line: "#E3E3E3", card: "#FFFFFF", accentOnDark: "#BAE3FA"}
  bg: plain                               # the 16 px dot grid is drawn by the status / editor / endcard blocks

# Score option B (the shot list's drafted decision): our own film-style score on hf01's grid, bright F major, 87.01 BPM,
# first beat 0.1107 s (SOUND.md §7): groove in after the S05 card cut (n665.3), one dip on the guest map (S19), silence,
# then the sting 0.368 s into the end card. Vacuum rule: in-suit sound only until the re-entry roar (S24).
# Not rendered at the storyboard stage. The user listens.
music: {style: film, bpm: 87.01, downbeat: 0.1107, key: F, drop: S05, breaks: [S19], hit: 0.368}

# her film's timeline, per loop (the planned slots are dashed with a '?': her day fills them)
