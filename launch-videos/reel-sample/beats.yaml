# reel-sample — an Instagram/TikTok-style reel built from the skill's reel blocks (sticker · split · float · cta, plus a
# word-pop `caption:` on any of them), in all three aspects at reel pacing (4–6 beats a shot, moving exits).
# Popframe is a FICTIONAL placeholder brand (vivid palette, stand-in logo). The bg-*.jpg / before / after stills are
# procedurally drawn stand-ins for AI footage: swap in the clips you generate (Higgsfield, Veo, Kling …) as
# `bg: assets/your-clip.mp4` (and `before`/`after`/`card` take footage too) — nothing else changes.
title: Popframe reel
slug: popframe-reel
aspects: [9x16, 16x9, 1x1]
thumbnail: s1

brand:
  name: Popframe
  mono: P
  logo: assets/logo.svg
  colors:
    accent: "#7C5CFF"       # violet: offset shadows, plates, the caption's current word
    accent2: "#C6FF3D"      # lime: accent words, ribbons, after/INPUT chips
    accent3: "#FF4FD8"
    dark: "#0B0B10"         # ink: strokes, pills, dark backdrops
    bg: "#0B0B10"
    accentOnDark: "#7C5CFF"
  bg: plain

music: {style: playful, bpm: 128}

shots:
  - id: s1
    block: sticker
    beats: 6
    theme: dark
    style: outline
    text: AI *motion* swap
    kicker: Popframe × Studio
    logo: true
    ribbon: Free to start
    bg: assets/bg-sunset.jpg
    out: whip-left
    note: Hook. Outline sticker, kicker pill with logo, ribbon (no caption — the hook carries enough words).

  - id: s2
    block: float
    beats: 5
    theme: dark
    bg: assets/bg-neon.jpg
    card: assets/app-prompt.jpg
    label: Input
    text: Just *type it*
    out: whip-left
    note: Floating card, INPUT brackets, speed streak, headline (a wide card stacks under it; a tall card or phone sits beside it on 16:9).

  - id: s3
    block: split
    beats: 6
    theme: dark
    before: assets/before-park.jpg
    after: assets/after-park.jpg
    labels: [Input, Output]
    text: Same *photo*
    caption: Pick a style, hit *generate*
    out: cut
    note: Side-by-side (stacked on 9:16) with chips and arrow.

  - id: s4
    block: sticker
    beats: 4
    theme: dark
    style: plate
    text: Restyle | *anything*
    ribbon: with Popframe
    bg: assets/bg-neon.jpg
    bgDim: .4
    tilt: -4
    pos: bottom
    out: zoom-in
    note: Plate sticker, bottom position, no caption.

  - id: s5
    block: float
    beats: 6
    theme: dark
    device: phone
    from: right
    card: assets/after-park.jpg
    label: Output
    text: In your *pocket*
    caption: Export straight to your phone
    out: whip-up
    note: Phone variant from the right, with a headline — no bg, so it is an overlay (the --clips --alpha float).

  - id: s6
    block: split
    beats: 5
    theme: dark
    mode: wipe
    before: assets/before-park.jpg
    after: assets/after-park.jpg
    caption: Drag to compare
    out: cut
    note: Wipe mode, default labels.

  - id: s7
    block: sticker
    beats: 4
    theme: dark
    style: pill
    text: Post *tonight*
    tilt: 4
    pos: top
    shake: false
    caption: Zero editing skills
    out: whip-right
    note: Pill sticker over nothing (an overlay for your own footage), no shake, top.

  - id: s8
    block: cta
    beats: 6
    theme: dark
    word: Popframe
    bg: assets/bg-neon.jpg
    bgDim: .55
    note: Comment-keyword end card.
