<script>
window.ready = (async () => {
  await Promise.all([400,500,600,700].map(w => document.fonts.load(`${w} 20px Inter`)));
  const b = document.body;
  for (let i = 0; i < 12; i++) cover(b, i, { x: 10 + i * 88, y: 10, w: 80, h: 80, title: STORY.shows[i] });
  for (let i = 0; i < 8; i++) appScreen(b, i, { x: 10 + i * 66, y: 100, w: 60, h: 130, r: 9 });
  ['home','library','player','chapters'].forEach((k, i) => { const p = phone(b, { x: 560 + i * 128, y: 100, w: 112, h: 243, b: 4, r: 18 }); hush(p.screen, k, { w: 112, h: 243, r: 14 }); });
  STORY.crew.forEach((c, i) => { const m = crew(b, c.id, ['open','blink','happy','dots','open','happy'][i], 60); placeCrew(m, 50 + i * 80, 300, ['open','blink','happy','dots','open','happy'][i]); });
  STORY.reviews.forEach((r, i) => { avatar(b, r.who, { x: 20 + i * 40, y: 380, d: 30 }); stars(b, r.stars, { x: 20, y: 430 + i * 18, size: 12 }); });
  return true; })();
