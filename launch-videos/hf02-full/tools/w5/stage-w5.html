<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>hf02 full — stage</title>
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(../../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 500; src: url(../../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 600; src: url(../../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 700; src: url(../../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 800; src: url(../../node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2) format('woff2'); }
html, body { margin: 0; padding: 0; width: 1080px; height: 608px; overflow: hidden; background: var(--paper); }
:root { --paper: #F5F3EF; --ink: #16151B; --ink2: #6E6B73; --ink3: #A29FA8; --rule: #E6E2DC; --card: #FFFFFF; }
body { font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; font-kerning: normal; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 608px; overflow: hidden; }
/* each scene is padded 200px past the frame so a blurred or moved scene never pulls in empty space at the edges */
.scene { position: absolute; left: -200px; top: -200px; width: 1480px; height: 1008px; overflow: hidden; }
.scene > .cam { position: absolute; left: 200px; top: 200px; width: 1080px; height: 608px; }
.abs { position: absolute; }
.t { position: absolute; white-space: nowrap; line-height: 1; }
.ml { position: absolute; white-space: nowrap; }
.crew { position: absolute; overflow: visible; }
.crew svg { display: block; width: 100%; height: 100%; overflow: visible; }
.abs > svg { display: block; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs id="fx"></defs></svg>
<div id="stage"></div>
<script src="../../lib/core.js"></script>
<script src="../../lib/cast.js"></script>
<script src="../../lib/art.js"></script>
<script src="../../lib/app.js"></script>
<script src="../../story.js"></script>
<!-- measured motion (one file per builder) -->
<script src="../../motion/w5.js"></script>
<!-- scenes (one file per builder; each calls scene({...}) for the shots it owns) -->
<script src="../../scenes/w5-fan.js"></script>
<script>
window.seek = seek;
window.ready = (async () => {
  await Promise.all([400, 500, 600, 700, 800].map(w => document.fonts.load(`${w} 20px Inter`)));
  mountScenes();
  await seek(0); return true;
})();
</script>
</body>
</html>
