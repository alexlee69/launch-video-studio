# beats.yaml — a 15 s launch starter (lv.mjs --init --kit launch15): the shortest whole story a launch can tell, at
# 120 BPM (one beat = 0.5 s, 30 beats). The brief's pacing targets are built in: a surprise by 2 s (the hook), the
# product by 3 s (the prompt bar), the brand by 5 s (the name at 1 s), one idea per 2–4 s, something new about every
# 0.5 s.
#   0:00 hook (no words) → 0:01 the name → 0:03 the prompt, pressed on the 5.5 s beat → 0:06 the result, on the drop
#   and the bar line, held for 1.5 s → 0:08 one → many → 0:09.5 proof → 0:11 the call to action → 0:13 the end card,
#   held to 0:15.
# 8 shots of 1–3 s. 12 words to read, as lv.mjs --grid counts them (the prompt in the bar included): keep it to 16 or
# fewer, since each word costs about 0.35 s of reading time.
# Transitions (the brief's passport): hard cuts, plus one signature, the name zooming through the camera, and one move
# that keeps something across a cut, with its `cause:` — the result's dark world pours out of the pressed send button
# (out: flood). The result card then splits into the fan of results (from: card on the fan).
# It runs as is: no footage needed yet. Drop your clips into assets/ and swap the placeholder cards for them, or put
# footage behind any shot with `bg:` (GUIDE.md → "Reels and launch films"). lv.mjs --blocks lists every block and field.
title: Lanternfish Notes 15 s launch
slug: lanternfish-notes
aspects: [16x9, 9x16, 1x1]       # each is re-laid out, not cropped
thumbnail: result

brand:
  name: Lanternfish Notes
  mono: L
  # logo: assets/logo.svg        # your mark (SVG/PNG): the end card
  colors: {bg: "#F4F4F7", ink: "#111116", muted: "#80808C", accent: "#5747F2", accent2: "#FF7A45", accent3: "#FFB547", line: "#C9CBD6"}
  bg: plain

music: {style: keynote, bpm: 120, drop: result}   # the intro builds to the press; the groove drops as the result lands

shots:
  # 0:00–0:01 · the hook (2 beats): no words, the most arresting picture you have, already moving; cut on the motion.
  # (block: particles, mode: burst — a seeded dot field bursting — needs ≥ 1.5 s to read: use it for a longer hook)
  - id: hook
    block: media
    beats: 2
    src: assets/placeholder-clip-1.svg   # your strongest AI clip (.mp4/.mov, from: seconds into it); a still only drifts
    out: cut

  # 0:01–0:03 · the name (4 beats) settles, then zooms through the camera: the film's one signature move
  - id: name
    block: type
    beats: 4
    theme: dark                  # a dark title card: the cut out of the zoom-through must read as a cut (QA checks it)
    text: Lanternfish Notes                # your product's name
    face: serif                  # sans | serif | brand (brand.font)
    through: true
    out: cut

  # 0:03–0:06 · the prompt and the click (6 beats): what the viewer would type, 30 characters at most, in a big prompt
  # bar; the cursor arrives at 4.5 s and presses send on the 5.5 s beat, and the result's dark world pours out of the
  # button (out: flood) to fill the frame on the 6 s bar line
  - id: ask
    block: press
    control: send                # button (label: Generate, after: "Generating…") | key | toggle | send
    beats: 6
    label: Make our launch teaser
    at: 75                       # local 30-fps frames: the press lands at 5.5 s, a beat
    out: flood
    flood: {from: control, spot: [0.9, 0.5]}   # a point inside the bar, as fractions of its box: the send button
    cause: the cursor presses send

  # 0:06–0:08 · the result (4 beats): on the drop it grows out of the pressed point (from: cursor), lands within
  # 0.5 s and holds for 1.5 s; a hard cut leaves it
  - id: result
    block: float
    beats: 4
    theme: dark                  # the colour the flood pours (the next shot's background)
    from: cursor                 # born at the cursor's tip, the pressed point (a layer of the previous shot): the bar
                                 # itself is under the flood by then, so a card born at its size and place popped in
    card: assets/placeholder-screen.svg    # your result: a screenshot, a screen recording, a generated clip
    label: Output
    out: cut

  # 0:08–0:09.5 · one → many (3 beats): the result card splits into a fan of results (from: card — the hero takes its
  # size and place), then the fan pushes into the hero for the cut
  - id: scale
    block: fan
    beats: 3
    from: card
    cards: [assets/placeholder-clip-1.svg, assets/placeholder-clip-2.svg, assets/placeholder-screen.svg, assets/placeholder-clip-3.svg, assets/placeholder-clip-4.svg]
    pick: 2                      # the hero: the same picture as the result card
    out: cut

  # 0:09.5–0:11 · proof (3 beats): one number, said big
  - id: proof
    block: stat
    beats: 3
    value: 10                    # your claim, as approved by legal: a number you can source
    suffix: "×"
    label: faster
    out: cut

  # 0:11–0:13 · the call to action (4 beats), as big as the name and on the same dark card: the bookend
  - id: cta
    block: type
    beats: 4
    theme: dark
    text: Try it free.           # 3 words at most: under 2 s to read
    face: serif
    out: cut

  # 0:13–0:15 · the end card (4 beats): the lockup lands in 0.5 s and holds; the address fades in under it
  - id: end
    block: endcard
    beats: 4
    url: lanternfish-notes.app             # your address
    cast: 0
