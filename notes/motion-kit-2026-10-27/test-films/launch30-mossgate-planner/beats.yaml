# beats.yaml — a 30 s launch starter (lv.mjs --init --kit launch30): the full arc at 120 BPM (one beat = 0.5 s, 60
# beats). The brief's pacing targets are built in: a surprise by 2 s (the hook), the brand by 5 s (the title at 1 s),
# the product by 3 s (its screen, under the feature line), one idea per 2–4 s, something new about every 0.5 s.
#   hook → title → feature → action → result → inputs → output → before → after → punctuation → one → many → proof →
#   summary → the title again → the call to action → the end card.
# 15 shots of 1–3 s (paired beats share a shot: inputs → output, before → after). 31 words to read, as lv.mjs --grid
# counts them (the prompt in the bar and the address bar included): that is the cap, so cut a word before adding one;
# each word costs about 0.35 s of reading time.
# Transitions (the brief's passport): hard cuts and drifts, plus one signature, the title zooming through the camera,
# and two moves that keep one thing across a cut, each with its `cause:` — the result's dark world pours out of the
# pressed send button (out: flood), and the result card is carried into the output half of the comparison (carry:).
# It opens and closes in the dark: the title card, its repeat and the end card share one dark register.
# It runs as is: no footage needed yet. Drop your clips into assets/ and swap the placeholder cards for them, or put
# footage behind any shot with `bg:` (GUIDE.md → "Reels and launch films"). lv.mjs --blocks lists every block and field.
title: Mossgate Planner 30 s launch
slug: mossgate-planner
aspects: [16x9, 9x16, 1x1]       # each is re-laid out, not cropped
thumbnail: result

brand:
  name: Mossgate Planner
  mono: M
  # logo: assets/logo.svg        # your mark (SVG/PNG): the end card
  colors: {bg: "#F4F4F7", ink: "#111116", muted: "#80808C", accent: "#5747F2", accent2: "#FF7A45", accent3: "#FFB547", line: "#C9CBD6"}
  bg: plain

music: {style: keynote, bpm: 120, breaks: [punct]}   # the groove drops on the title; it dips for the punctuation beat

shots:
  # 0:00–0:01 · the hook (2 beats): no words, the most arresting picture you have, already moving
  # (block: particles, mode: burst — a seeded dot field bursting — needs ≥ 1.5 s to read: use it for a longer hook)
  - id: hook
    block: media
    beats: 2
    src: assets/placeholder-clip-2.svg   # your strongest AI clip (.mp4/.mov, from: seconds into it); a still only drifts
    out: cut

  # 0:01–0:03 · the title (4 beats) settles, then zooms through the camera: the film's one signature move
  - id: title
    block: type
    beats: 4
    theme: dark                  # a dark title card: the cut out of the zoom-through must read as a cut (QA checks it)
    text: Mossgate Planner                # your product's name
    face: serif
    through: true
    out: cut

  # 0:03–0:06 · the feature (6 beats): what it does, in one line, over the product itself
  - id: feature
    block: media
    beats: 6
    src: assets/placeholder-screen.svg   # a screenshot or screen recording of your product
    device: browser
    url: mossgate-planner.app             # your address
    text: Launch films, *cut for you.*
    out: drift-up

  # 0:06–0:08.5 · the action (5 beats): the prompt in a big bar; the cursor arrives at 7 s and presses send on the 8 s
  # bar line, and the result's dark world pours out of the button (out: flood) to fill the frame on the cut
  - id: action
    block: press
    control: send                # button (label: Generate, after: "Generating…") | key | toggle | send
    beats: 5
    label: Cut our Friday teaser
    at: 60                       # local 30-fps frames: the press lands at 8.0 s, on the bar line
    out: flood
    flood: {from: control, spot: [0.9, 0.5]}   # a point inside the bar, as fractions of its box: the send button
    cause: the cursor presses send

  # 0:08.5–0:10.5 · the result (4 beats): it grows out of the pressed point (from: cursor) and holds, then the
  # card is carried on into the output half of the next shot while the rest drifts left (carry: — fastest on the cut)
  - id: result
    block: float
    beats: 4
    theme: dark                  # the colour the flood pours (the next shot's background)
    from: cursor                 # born at the cursor's tip, the pressed point (a layer of the previous shot): the bar
                                 # itself is under the flood by then, so a card born at its size and place popped in
    card: assets/placeholder-screen.svg    # your result: a screenshot, a screen recording, a generated clip
    label: Output
    carry: {el: card, to: after}
    cause: the output slides into its place beside the input
    out: drift-left

  # 0:10.5–0:12.5 · inputs → output (4 beats): what went in, what came out, side by side (the output: the same picture as
  # the result card, which lands on it)
  - id: inout
    block: split
    beats: 4
    before: assets/placeholder-clip-3.svg
    after: assets/placeholder-screen.svg
    labels: [Input, Output]
    out: drift-left

  # 0:12.5–0:14.5 · before → after (4 beats): a divider wipes the old version away
  - id: change
    block: split
    beats: 4
    mode: wipe
    before: assets/placeholder-wipe-before.svg
    after: assets/placeholder-wipe-after.svg
    out: cut

  # 0:14.5–0:16 · punctuation (3 beats): one word, the music dips under it
  - id: punct
    block: type
    beats: 3
    text: "*Done.*"
    out: cut

  # 0:16–0:17.5 · one (3 beats): one → many — the cards deal out of the hero onto a fan, then it pushes into the hero
  - id: one
    block: fan
    beats: 3
    cards: [assets/placeholder-clip-1.svg, assets/placeholder-clip-2.svg, assets/placeholder-screen.svg, assets/placeholder-clip-3.svg, assets/placeholder-clip-4.svg]
    pick: 2                      # the hero: your result again
    out: cut

  # 0:17.5–0:19.5 · many (4 beats): a grid of them cascades in from the centre, one tile lit (the first card), with the
  # claim on a band
  - id: many
    block: wall
    layout: grid
    beats: 4
    cards: [assets/placeholder-screen.svg, assets/placeholder-clip-1.svg, assets/placeholder-clip-2.svg, assets/placeholder-clip-3.svg, assets/placeholder-clip-4.svg]
    text: 120 films studied.     # your claim, as approved by legal
    out: drift-up

  # 0:19.5–0:21.5 · proof (4 beats): one number, said big
  - id: proof
    block: stat
    beats: 4
    value: 10                    # your claim, as approved by legal: a number you can source
    suffix: "×"
    label: faster
    out: cut

  # 0:21.5–0:24 · the summary (5 beats): the whole film in four words
  - id: summary
    block: headline
    beats: 5
    text: Brief it. *Ship it.*
    out: cut

  # 0:24–0:26 · the title again (4 beats): the bookend (2 s: a two-word name needs 1.6 s to read)
  - id: again
    block: type
    beats: 4
    theme: dark                  # the same dark title card as at the open
    text: Mossgate Planner                # your product's name
    face: serif
    out: cut

  # 0:26–0:28 · the call to action (4 beats), said big
  - id: cta
    block: headline
    beats: 4
    text: Try it *free.*         # 3 words at most: under 2 s to read
    out: cut

  # 0:28–0:30 · the end card (4 beats), dark like the open: the lockup lands in 0.5 s and holds; the address fades in
  - id: end
    block: endcard
    beats: 4
    theme: dark
    url: mossgate-planner.app             # your address
    cast: 0
